[project]
name = "argus-dd"
version = "0.1.0"
description = "Deterministic FDD helper for Slovenian companies (AJPES / AOP)."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "reportlab>=5.0.1",
]

[project.scripts]
argus-synth = "argus.synth:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
